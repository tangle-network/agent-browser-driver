# Post-merge safety net. NOT the merge gate.
#
# This needs a real `OPENAI_API_KEY` and a live `AI_TANGLE_STORAGE_STATE`
# session against ai.tangle.tools — neither is something a local
# `pnpm signoff` run can hold, so it was never something the local gate could
# mirror — see docs/SIGNOFF.md. It no longer triggers on `pull_request` so it
# can never block a person waiting on a pull request; it still runs on every
# push to `main` and on `workflow_dispatch`, and a failure files into the same
# rolling safety-net issue `ci.yml` uses.
name: Tier2 Staging Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tier2-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_TANGLE_STORAGE_STATE: ${{ secrets.AI_TANGLE_STORAGE_STATE }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ] || [ -z "${AI_TANGLE_STORAGE_STATE}" ]; then
            echo "::warning::Required secrets not available — skipping Tier2 gate"
            echo "SKIP_GATE=true" >> "$GITHUB_ENV"
          fi

      - name: Materialize storage state
        if: env.SKIP_GATE != 'true'
        env:
          AI_TANGLE_STORAGE_STATE: ${{ secrets.AI_TANGLE_STORAGE_STATE }}
        run: |
          mkdir -p ./.auth
          printf '%s' "${AI_TANGLE_STORAGE_STATE}" > ./.auth/ai-tangle-tools.json
          node -e "JSON.parse(require('node:fs').readFileSync('./.auth/ai-tangle-tools.json','utf8'))"

      - name: Run repeated staging gate
        if: env.SKIP_GATE != 'true'
        run: |
          pnpm bench:tier2:repeat -- \
            --out ./agent-results/tier2-staging \
            --model "${{ vars.BAD_CI_MODEL || 'groq/llama-3.1-8b-instant' }}" \
            --storage-state ./.auth/ai-tangle-tools.json \
            --repetitions 2 \
            --min-full-pass-rate 1 \
            --min-fast-pass-rate 1 \
            --max-avg-turns 45 \
            --max-avg-duration-ms 300000
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # groq/* model ids resolve only through an OpenAI-compatible router;
          # override both vars together to pin a direct-provider model.
          LLM_BASE_URL: ${{ vars.BAD_CI_LLM_BASE_URL || 'https://router.tangle.tools/v1' }}

      - name: Upload gate artifacts
        if: always() && env.SKIP_GATE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tier2-staging-results
          path: ./agent-results/tier2-staging

  # See ci.yml's `safety-net-issue` job for the shape and why it is one
  # rolling issue rather than one per push. Same title, same issue.
  safety-net-issue:
    name: File the safety-net failure
    needs: [tier2-gate]
    if: always() && needs.tier2-gate.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File or append the safety-net failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Post-merge safety net is red on main'
          body="$(printf '%s\n' \
            "Commit \`${SHA}\` failed the post-merge Tier2 staging gate." \
            "" \
            "- run: ${RUN_URL}" \
            "- pushed by: @${ACTOR}" \
            "" \
            "This gate needs a real OPENAI_API_KEY and a live AI_TANGLE_STORAGE_STATE" \
            "session — it has no local equivalent. See docs/SIGNOFF.md.")"
          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "appended to issue #$number"
          else
            gh issue create --title "$title" --body "$body"
          fi
